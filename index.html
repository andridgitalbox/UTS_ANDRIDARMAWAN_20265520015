<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UTS Augmented Reality Marker-Based</title>
    <!-- Import A-Frame -->
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <!-- Import AR.js untuk A-Frame -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <!-- Import A-Frame Extras untuk menjalankan animasi 3D -->
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>
  </head>

  <body style="margin: 0px; overflow: hidden;">
    <!-- Inisialisasi Scene AR -->
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">

      <!-- Aset / Resource (Model 3D + Animasi) -->
      <a-assets>
        <!-- Ganti URL di bawah dengan lokasi file model 3D (.gltf/.glb) milikmu -->
        <a-asset-item id="model3d" src="https://raw.githack.com/KhronosGroup/glTF-Sample-Models/master/2.0/CesiumMan/glTF-Binary/CesiumMan.glb"></a-asset-item>
      </a-assets>

      <!-- Marker Hiro (Default Marker) -->
      <a-marker preset="hiro">
        <!-- Menampilkan Model 3D dengan Animasi -->
        <a-entity 
          gltf-model="#model3d" 
          scale="1 1 1" 
          position="0 0 0" 
          rotation="0 0 0"
          animation-mixer> <!-- 'animation-mixer' memutar animasi bawaan file 3D -->
        </a-entity>
      </a-marker>

      <!-- Kamera AR -->
      <a-entity camera></a-entity>

    </a-scene>
  </body>
</html>
